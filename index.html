<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>AILES | 幡ヶ谷キッズチアダンス</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --purple: #a855f7;
      --purple-dark: #7c3aed;
      --pink: #f472b6;
      --stepup-blue: #b3e0ff;
      --advance-yellow: #fffde0;
      --stepup-border-yellow: #f7e27d;
      --advance-border-blue: #8cc9ff;
      --yellow-border: #f7d94c;
      --blue-logo: #2a6fd4;
      --text: #1f2933;
      --muted: #6b7280;
      --bg-soft: #e0f4ff;
      --radius: 16px;
      --shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--text);
      background: var(--bg-soft);
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.1);
      padding: 10px 20px;
      z-index: 50;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav button {
      background: none;
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--muted);
    }

    nav button:hover {
      background: rgba(0,0,0,0.05);
      color: var(--text);
    }

    .nav-cta {
      background: var(--purple);
      color: #fff;
    }

    section {
      padding: 70px 20px;
    }

    .inner {
      max-width: 1100px;
      margin: auto;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .lead {
      color: var(--muted);
      margin-bottom: 30px;
      line-height: 1.7;
    }

    .hero {
      text-align: center;
      padding-top: 80px;
    }

    .hero-title {
      font-size: 2.4rem;
      margin-bottom: 16px;
    }

    .hero-team {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--blue-logo);
      margin-bottom: 10px;
      text-shadow:
        -2px -2px 0 var(--yellow-border),
         2px -2px 0 var(--yellow-border),
        -2px  2px 0 var(--yellow-border),
         2px  2px 0 var(--yellow-border);
    }

    .hero-team-small {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--blue-logo);
      margin-bottom: 25px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-right: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      box-shadow: var(--shadow);
    }

    .btn-ghost {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.2);
      color: var(--purple-dark);
    }

    /* ====== クラス紹介 ====== */
    .class-grid {
      display: flex;
      gap: 24px;
      align-items: stretch;
    }

    .class-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      box-sizing: border-box;
      height: 100%;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .class-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      object-position: center;
      border-radius: var(--radius);
      margin-bottom: 10px;
    }

    /* ステップアップクラス（青背景＋黄色縁取り） */
    .class-stepup {
      background: var(--stepup-blue);
      border: 4px solid var(--stepup-border-yellow);
    }

    /* アドバンスクラス（薄黄色背景＋青縁取り） */
    .class-advance {
      background: var(--advance-yellow);
      border: 4px solid var(--advance-border-blue);
    }

    /* ====== アクセス ====== */
    .access-grid {
      display: flex;
      justify-content: center;
    }

    .access-box {
      border: 1px dashed var(--muted);
      padding: 20px;
      border-radius: var(--radius);
      text-align: center;
      background: #fff;
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: var(--muted);
      border-top: 1px solid rgba(0,0,0,0.1);
    }

    @media (max-width: 600px) {
      .hero-title { font-size: 1.8rem; }
      .hero-team { font-size: 2rem; }
      .hero-team-small { font-size: 1rem; }
      .class-grid { flex-direction: column; }
    }
  </style>

  <script>
    function scrollToId(id) {
      const el = document.getElementById(id);
      const y = el.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({ top: y, behavior: "smooth" });
    }
  </script>
</head>

<body>

  <header>
    <div class="header-inner">
      <div class="logo-area">
        <div>
          <strong>AILES</strong><br>
          <small>幡ヶ谷キッズチアダンス</small>
        </div>
      </div>

      <nav>
        <button onclick="scrollToId('top')">トップ</button>
        <button onclick="scrollToId('classes')">クラス紹介</button>
        <button onclick="scrollToId('access')">アクセス</button>
        <button class="nav-cta" onclick="scrollToId('contact')">お問い合わせ</button>
      </nav>
    </div>
  </header>

  <section id="top" class="hero">
    <div class="inner">

      <h1 class="hero-title">幡ヶ谷で楽しくチアダンス♪</h1>
      <div class="hero-team">AILES</div>

      </p>
